<section class="relative w-full min-h-[360px] md:min-h-[420px] flex items-center bg-cover bg-center bg-no-repeat overflow-hidden" style="background-image: url('{{ hero_bg | default('https://images.unsplash.com/photo-1522071820081-009f0129c71c') }}');">
    <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-[1px]"></div>

    <div class="relative z-10 container mx-auto px-6 md:px-12 py-16 text-white">
        <nav class="flex items-center space-x-2 paragraph-14 text-gray-300 mb-8 tracking-wide">
            <a href="{{ 'home' | page }}" class="hover:text-white transition-colors">Beranda</a>
            <span class="text-gray-400 font-bold">&rsaquo;</span>
            <span class="text-white ">{{ this.page.title }}</span>
        </nav>

        <div class="max-w-2xl space-y-4">
            <h1 class="heading-40-bold sm:heading-44-bold text-white leading-tight">
                {{ this.page.title }}
            </h1>
            {% if this.page.description %}
                <p class="paragraph-16 sm:paragraph-18 text-gray-200 leading-relaxed">
                    {{ this.page.description }}
                </p>
            {% endif %}
        </div>
    </div>
</section>
